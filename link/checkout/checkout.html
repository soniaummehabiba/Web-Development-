<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.2em;
            font-weight: bold;
        }
        .header .back-arrow {
            font-size: 1.5em;
            cursor: pointer;
        }
        .header .heart-icon {
            font-size: 1.5em;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }
        .cart-item img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            margin-right: 15px;
            object-fit: cover;
        }
        .item-details {
            flex-grow: 1;
        }
        .item-details h3 {
            margin: 0;
            font-size: 1.1em;
            color: #333;
        }
        .item-details p {
            margin: 5px 0 0;
            font-size: 0.9em;
            color: #777;
        }
        .item-actions {
            display: flex;
            align-items: center;
        }
        .item-actions .price {
            font-weight: bold;
            color: #333;
            margin-right: 10px;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .quantity-control button {
            background-color: #f8f8f8;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 1em;
            color: #555;
        }
        .quantity-control span {
            padding: 5px 10px;
            background-color: #fff;
            font-size: 1em;
            color: #333;
        }
        .summary {
            padding: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1em;
        }
        .summary-row .label {
            color: #555;
        }
        .summary-row .value {
            font-weight: bold;
            color: #333;
        }
        .summary-row.total {
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 15px;
            font-size: 1.2em;
        }
        .checkout-button {
            background-color: #ff6a00;
            color: #fff;
            border: none;
            padding: 15px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            width: calc(100% - 40px);
            margin: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="back-arrow">&lt;</span>
            <span>Cart</span>
            <span class="heart-icon">&#x2665;</span>
        </div>
        <div class="cart-item">
            <img src="C:\Users\hp\Desktop\link\checkout\images\download-removebg-preview (1).png">
            <div class="item-details">
                <h3>Beef Burger</h3>
                <p>Double Beef</p>
            </div>
            <div class="item-actions">
                <span class="price">$6.59</span>
                <div class="quantity-control">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>
        </div>
        <div class="cart-item">
            <img src="C:\Users\hp\Desktop\link\checkout\images\download-removebg-preview (1).png"alt="Beef Burger">
            <div class="item-details">
                <h3>Beef Burger</h3>
                <p>Double Beef</p>
            </div>

                <span class="price">$6.59</span>
                <div class="quantity-control">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>
        </div>
        <div class="cart-item">
            <img src="C:\Users\hp\Desktop\link\checkout\images\download-removebg-preview (1).png"alt="Beef Burger">
            <div class="item-details">
                <h3>Beef Burger</h3>
                <p>Double Beef</p>
            </div>
            <div class="item-actions">

                <div class="quantity-control">
                    <button>-</button>

        </div>
        <div class="summary">
            <div class="summary-row">

    </div>
</body>
</html>
