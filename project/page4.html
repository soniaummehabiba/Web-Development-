<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Order Form</title>
  <link rel="stylesheet" href="C:\Users\sonia\Desktop\project\css\page4.css">
</head>
<body>

  <div class="form-container">
    <h1>Order Now</h1>
    <p>Please fill all the required fields!</p>

    <form id="orderForm">
      <label>Your Name</label>
      <div class="row">
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>
      </div>

      <label>Full Email Address</label>
      <input type="email" placeholder="client@gmail.com" required>

      <label>Your Number</label>
      <input type="tel" placeholder="+987654321" required>

      <label>Your Shipping Address</label>
      <input type="text" placeholder="Address line 1" required>
      <input type="text" placeholder="Address line 2">

     <div class="row">
        <input type="text" placeholder="Your City" required>
        <input type="text" placeholder="Your Region" required>
      </div>

      <div class="row">
        <input type="text" placeholder="Postal / Zip Code" required>
        <select>
          <option>KARACHI</option>
          <option>LAHORE</option>
          <option>ISLAMABAD</option>
        </select>
      </div>

      <button type="submit">submit</button>
    </form>
  </div>

  <script src="C:\Users\sonia\Desktop\project\javascript\page4.js"></script>
</body>
</html>
