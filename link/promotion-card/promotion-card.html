<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Promotion - Chicken Wings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #000; /* Black background as in the image */
            color: #fff; /* White text for contrast */
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #000;
            border-bottom: 5px solid #333; /* Subtle line below header */
        }
        .menu-icon-3lines {
            font-size: 24px;
            cursor: pointer;
            padding-right: 15px; /* Spacing for the menu icon */
        }
        .kfc-logo {
            font-size: 28px;
            font-weight: bold;
            color: #E4002B; /* KFC Red */
            margin-right: auto; /* Pushes other elements to the right */
        }
        .header-buttons button {
            background-color: #E4002B;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .promo-section {
            text-align: center;
            padding: 40px 20px;
        }
        .promo-section h1 {
            font-size: 3em;
            margin-bottom: 30px;
        }
        .product-card {
           
            background-color: #222; /* Darker background for the card */
            border-radius: 10px;
            padding: 20px;
            max-width: 350px;
            margin: 0 auto;
            text-align: left;
            position: relative;
        }
        .product-card .heart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #E4002B;
            font-size: 24px;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .product-card h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #fff;
        }
        .product-card p {
            font-size: 1em;
            color: #ccc;
        }
        .product-card .price {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 100px;
            margin-top: 20px;
        }
        .add-to-bucket-btn {
            background-color: #E4002B;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <header>
        <div class="menu-icon-3lines">☰</div>
        <div class="kfc-logo">KFC</div>
        <div class="header-buttons">
            <button>DELIVERY</button>
            <button>Promotion</button>
        </div>
    </header>
    <div class="promo-section">
        <h1>PROMOTION</h1>
        <div class="product-card">

            <div class="heart-icon">&#x2764;</div>
            
            <img src="images/kfc.png" width=50px; height=60px; alt="KFC chicken Wings">
           
            <h2>Chicken Wings</h2>
            <p>Hot and crispy 8 pcs of wings glazed in spicy Ramen Sauce...</p>
            
            <div class="price">Rs 775</div>
            <img src="images/burger.png" style="opacity: 0.5">

                     <a href="C:\Users\hp\Desktop\link\buy-now\buy-now.html">

            <button class="add-to-bucket-btn">+ ADD TO BUCKET</button>
                     </a>
        </div>
    </div>
</body>
</html>
